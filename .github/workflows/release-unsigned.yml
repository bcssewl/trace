name: release-unsigned

# Free, no-Apple-account release path. On a version tag it builds an AD-HOC
# signed .app (the minimum for the app to launch on Apple Silicon), packages an
# UNSIGNED .dmg, and publishes it to a GitHub Release — using only the built-in
# GITHUB_TOKEN, with no Apple Developer secrets.
#
# The published DMG is NOT notarized, so macOS Gatekeeper blocks it on first
# open; the Release notes tell users to right-click → Open (see README).
#
# Sparkle.framework is fetched from Sparkle's own public release (no secret).
# Its version is pinned to match the Sparkle SwiftPM dependency in
# Package.resolved.
#
# When you later set up Developer ID signing + notarization, use the separate
# `release.yml` workflow (manual dispatch) instead for a Gatekeeper-clean DMG.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (without leading v)'
        required: true
        type: string

permissions:
  contents: write

env:
  SPARKLE_VERSION: '2.9.2'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the latest installed Xcode
        run: |
          set -euo pipefail
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          [ -n "$LATEST" ] || LATEST=/Applications/Xcode.app
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Resolve version + tag
        id: version
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
              VALUE="${{ inputs.version }}"
              TAG="v${VALUE}"
          else
              VALUE="${GITHUB_REF_NAME#v}"
              TAG="${GITHUB_REF_NAME}"
          fi
          echo "value=$VALUE" >>"$GITHUB_OUTPUT"
          echo "tag=$TAG"     >>"$GITHUB_OUTPUT"
          # A hyphen in the version (v1.2.3-beta.1) marks a pre-release: it is
          # excluded from releases/latest (the Stable update channel) and only
          # reaches installs on the Beta channel via the rolling beta-feed.
          if [[ "$VALUE" == *-* ]]; then
              echo "prerelease=true"  >>"$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Fetch Sparkle framework (public release, no secret)
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl -fLsS "$URL" -o "$RUNNER_TEMP/sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          cp -R "$RUNNER_TEMP/sparkle/Sparkle.framework" Frameworks/Sparkle.framework

      - name: Build DMG (stable self-signed if the cert secret is set, else ad-hoc)
        env:
          VERSION: ${{ steps.version.outputs.value }}
          CERT_P12: ${{ secrets.LOCAL_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.LOCAL_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CERT_P12:-}" ]; then
              # Stable self-signed identity → every release shares one signature,
              # so downloaders keep their granted permissions across updates.
              echo "==> stable self-signed build"
              KC="$RUNNER_TEMP/signing.keychain-db"
              KCPASS="${CERT_PASSWORD:-trace-local-signing}"
              security create-keychain -p "$KCPASS" "$KC"
              security set-keychain-settings "$KC"
              security unlock-keychain -p "$KCPASS" "$KC"
              echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
              security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$KCPASS" -A -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null 2>&1 || true
              security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
              rm -f "$RUNNER_TEMP/cert.p12"
              DEVELOPER_ID_APPLICATION="Trace Local Signing" CODESIGN_TIMESTAMP=0 \
                  ./scripts/build-app.sh --version "$VERSION" --skip-notarize --skip-sparkle
          else
              # Fallback: no cert secret configured → ad-hoc (runs, but each
              # update has a fresh signature so permissions reset every time).
              echo "==> no LOCAL_SIGNING_CERT_P12 secret; ad-hoc build"
              ./scripts/build-app.sh --adhoc --version "$VERSION"
          fi

      - name: Sign + generate the Sparkle appcast (in-app auto-update feed)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
              echo "::warning::SPARKLE_ED_PRIVATE_KEY not set — skipping appcast; installed apps won't see this release as an update."
              exit 0
          fi
          GEN="$RUNNER_TEMP/sparkle/bin/generate_appcast"
          # Process only THIS release's DMG in an isolated dir.
          mkdir -p dist/feed
          cp dist/Trace-*.dmg dist/feed/
          # generate_appcast mounts the DMG, reads the real bundle version (so
          # Sparkle's version comparison is correct), EdDSA-signs it, and writes
          # an appcast whose <enclosure> points at this release's download URL.
          # The key is piped via stdin (--ed-key-file -), never written to disk.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$GEN" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/bcssewl/trace/releases/download/${TAG}/" \
              --link "https://github.com/bcssewl/trace" \
              -o dist/feed/appcast.xml \
              dist/feed
          echo "== generated appcast =="
          cat dist/feed/appcast.xml

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="$(ls dist/Trace-*.dmg)"
          # Also publish a constant-named copy so the website button
          # (/releases/latest/download/Trace.dmg) is a one-click, always-newest
          # direct download. The versioned name stays for the appcast + archives.
          cp "$DMG" dist/Trace.dmg
          # Ship the signed appcast alongside the DMG so the app's "latest"
          # feed URL resolves to it; tolerate its absence (appcast step skipped).
          ASSETS=("$DMG" "dist/Trace.dmg")
          [ -f dist/feed/appcast.xml ] && ASSETS+=("dist/feed/appcast.xml")
          NOTES=$(cat <<'EOF'
          Self-signed build — not notarized by Apple, so macOS Gatekeeper still
          blocks it on first open.

          To run it the first time (macOS 15 Sequoia and later removed the old
          right-click → Open shortcut): try to open the app once, then go to
          **System Settings → Privacy & Security**, scroll to **Security**, click
          **Open Anyway**, and authenticate. You only do this once per version. If
          macOS says the app is "damaged", clear the download quarantine:

              xattr -dr com.apple.quarantine /Applications/Trace.app

          Permissions you grant carry over across updates. See the README
          "Download" section for details.
          EOF
          )
          # Plain string, not an array: the macOS runner's /bin/bash is 3.2,
          # where expanding an EMPTY array under `set -u` is an "unbound
          # variable" error. Unquoted expansion of an empty string adds no arg.
          PRERELEASE_FLAG=""
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && PRERELEASE_FLAG="--prerelease"
          gh release create "${{ steps.version.outputs.tag }}" "${ASSETS[@]}" \
              --title "Trace ${{ steps.version.outputs.value }}" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG \
              --verify-tag=false || \
          gh release upload "${{ steps.version.outputs.tag }}" "${ASSETS[@]}" --clobber

      - name: Refresh the rolling Beta-channel feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Beta update channel reads a constant URL:
          #   releases/download/beta-feed/appcast.xml
          # Every release — stable or pre-release — refreshes it, so Beta-channel
          # installs always see the newest build of either kind. (Stable installs
          # read releases/latest, which GitHub keeps clear of pre-releases.)
          if [ ! -f dist/feed/appcast.xml ]; then
              echo "::warning::No appcast generated — Beta feed not refreshed."
              exit 0
          fi
          if ! gh release view beta-feed >/dev/null 2>&1; then
              gh release create beta-feed \
                  --title "Beta update feed (rolling)" \
                  --notes "Machine-readable Sparkle feed for the Beta update channel. Always points at the newest build, pre-release or stable. Not for manual download — use the latest release instead." \
                  --prerelease \
                  --target "$GITHUB_SHA"
          fi
          gh release upload beta-feed dist/feed/appcast.xml --clobber
